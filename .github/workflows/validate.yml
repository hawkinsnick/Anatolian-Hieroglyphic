name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - run: python scripts/reconcile.py
      - run: python -m pytest -q
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) return;
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
              return;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `${tag} — digital identity and bibliography spine`,
              body: fs.readFileSync('docs/RELEASE-2.0.md', 'utf8'),
              draft: false, prerelease: false
            });
      - name: Validate method-parity interfaces
        run: |
          python scripts/test_preexpert_parity.py
          python scripts/build_corpus_browser.py
          test -s workbench/corpus-browser.html
          python scripts/research_api.py entries --text KARKAMI --limit 2 > /tmp/ah-api.json
          python scripts/export_research_layer.py json /tmp/ah.json
          test -s /tmp/ah.json.manifest.json
