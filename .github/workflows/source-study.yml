name: Bounded source study and prepared review
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/evidence_query.py --check
      - run: python scripts/source_study.py --check
      - run: python scripts/test_source_study.py
